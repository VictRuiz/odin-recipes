<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Lado izquierdo con imagen y logo -->
    <div class="sidebar">
      <div class="logo-container">
        <img src="https://cdn.statically.io/gh/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="Odin Logo" class="logo" />
        <h1 class="logo-text">ODIN</h1>
      </div>
      <p class="credit">Photo by Hallie West on Unsplash</p>
    </div>

    <!-- Lado derecho con formulario -->
    <div class="form-container">
      <div class="intro-text">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
        <p>You <em>know</em>you want to.</p>
      </div>

      <form action="#" method="post">
        <fieldset>
          <legend>Let’s do this!</legend>
          <div class="form-row">
            <div class="input-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first-name" required>
            </div>
            <div class="input-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last-name" required>
            </div>
          </div>
          <div class="form-row">
            <div class="input-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
          </div>
          <div class="form-row">
            <div class="input-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" pattern=".{8,}" required>
            </div>
            <div class="input-group">
              <label for="confirm-password">Confirm Password</label>
              <input type="password" id="confirm-password" name="confirm-password" pattern=".{8,}" required>
            </div>
          </div>
        </fieldset>

        <button type="submit">Create Account</button>
      </form>

      <p class="login-text">Already have an account? <a href="#">Log in</a></p>
    </div>
  </div>
</body>
</html>
